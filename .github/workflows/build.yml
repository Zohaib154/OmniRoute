name: Build App

# Manual-only since #11946. The hosted 7 GB runner can no longer build this tree — 19 of
# the last 30 runs died with "The runner has received a shutdown signal" (VM out of
# memory) ~8 min into `next build`, release/v3.8.51 itself included, even with the 10 GB
# swapfile below. Triggered on `push: branches: ["**"]` it painted every branch and every
# PR red while producing an artefact nothing downloads. The bundle is validated where a
# build actually fits:
#   - main:       ci.yml `Build` (self-hosted omni-build pool) on every merge
#   - release/**: nightly-release-green.yml (same pool, continuous)
# Dispatch this workflow by hand when a hosted build artefact is genuinely needed.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Fast Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"

      - name: Build Next.js app & CLI bundle
        run: |
          npm run build:release
        env:
          # Hosted artifact builds run with less memory than the opt-in 64 GB
          # CI build slot. Keep Webpack here without overriding the latter's
          # separately measured Turbopack policy (#16169). Validated 2026-10-18 on the
          # hosted runner (run 39151150605): webpack compiled in 7.1 min, job 17 min.
          # This is the floor docker-publish.yml must not go below
          # (tests/unit/docker-publish-build-heap-14325.test.ts).
          NODE_OPTIONS: "--max-old-space-size=10240"
          OMNIROUTE_BUILD_MEMORY_MB: "10240"
          OMNIROUTE_USE_TURBOPACK: "0"

      - name: Archive build outputs (Separate clean packages)
        run: |
          # Add launcher scripts for PC (Linux / Windows)
          cat << 'EOF' > .build/next/standalone/run.sh
          #!/bin/sh
          export PORT="${PORT:-20128}"
          echo "Starting OmniRoute on http://localhost:$PORT..."
          exec node server.js
          EOF
          chmod +x .build/next/standalone/run.sh

          cat << 'EOF' > .build/next/standalone/run.bat
          @echo off
          set PORT=20128
          echo Starting OmniRoute on http://localhost:%PORT%...
          node server.js
          pause
          EOF

          # Add Termux Android startup script and instructions
          cat << 'EOF' > .build/next/standalone/start-termux.sh
          #!/data/data/com.termux/files/usr/bin/bash
          export PORT="${PORT:-20128}"
          export HOST="0.0.0.0"
          export HOSTNAME="0.0.0.0"
          mkdir -p "$HOME/.cache"
          export XDG_CACHE_HOME="$HOME/.cache"

          echo "============================================="
          echo "  Starting OmniRoute on Termux (Android)"
          echo "  Local Web UI: http://localhost:$PORT"
          echo "============================================="

          exec node server.js
          EOF
          chmod +x .build/next/standalone/start-termux.sh

          cat << 'EOF' > .build/next/standalone/README-TERMUX.txt
          === OmniRoute on Termux (Android) ===

          Prerequisites:
            pkg update && pkg install nodejs -y

          Run:
            chmod +x start-termux.sh
            ./start-termux.sh

          Open your browser on Android:
            http://localhost:20128
          EOF

          # Package standalone server for PC (Windows / Linux)
          (cd .build/next/standalone && zip -r -q ../../../omniroute-server-pc.zip . -x "start-termux.sh" "README-TERMUX.txt")

          # Package dedicated Termux Android build
          (cd .build/next/standalone && zip -r -q ../../../omniroute-termux-android.zip . -x "run.bat")

          # Package CLI bundle
          (cd dist && zip -r -q ../omniroute-cli.zip .)

      - name: Upload OmniRoute Server (Windows / Linux PC)
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-server-pc
          path: omniroute-server-pc.zip
          retention-days: 14

      - name: Upload OmniRoute for Termux (Android)
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-termux-android
          path: omniroute-termux-android.zip
          retention-days: 14

      - name: Upload OmniRoute CLI
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-cli
          path: omniroute-cli.zip
          retention-days: 14
